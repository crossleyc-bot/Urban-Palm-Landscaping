# Custom nginx configuration for Urban Palm Landscaping on EB AL2023.
# Replaces the EB default to ensure all directives are in the correct context.

user                    nginx;
error_log               /var/log/nginx/error.log warn;
pid                     /var/run/nginx.pid;
worker_processes        auto;
worker_rlimit_nofile    200000;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log    /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip            on;
    gzip_comp_level 4;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow large file uploads (images, videos)
    client_max_body_size 100M;

    upstream nodejs {
        server 127.0.0.1:8080;
        keepalive 256;
    }

    server {
        listen 80;

        # ── HTTPS redirect ──────────────────────────────────────────
        # ALB sets X-Forwarded-Proto on client requests.
        # Health checks from the ALB do NOT carry this header, so they
        # pass straight through to the Node.js upstream.
        if ($http_x_forwarded_proto = 'http') {
            return 301 https://$host$request_uri;
        }

        # Strict Transport Security
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Reverse proxy to Node.js ────────────────────────────────
        location / {
            proxy_pass          http://nodejs;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $http_x_forwarded_proto;
        }

        # ── EB enhanced health reporting ────────────────────────────
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny  all;
        }

        # ── ELB health check (logged at access level only) ─────────
        location /api/health {
            proxy_pass          http://nodejs;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_set_header    Host $host;
        }
    }
}
