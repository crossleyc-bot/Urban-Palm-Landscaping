<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="brightSkyFY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48a0e0"/>
      <stop offset="100%" stop-color="#a5d5ee"/>
    </linearGradient>
    <linearGradient id="greenLawnFY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48aa50"/>
      <stop offset="100%" stop-color="#388a40"/>
    </linearGradient>
    <linearGradient id="cleanRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <filter id="houseShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <pattern id="lawnStripesFY" width="400" height="28" patternUnits="userSpaceOnUse">
      <rect width="400" height="14" fill="#42a548" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Beautiful blue sky -->
  <rect width="400" height="300" fill="url(#brightSkyFY)"/>

  <!-- Sun -->
  <circle cx="50" cy="35" r="32" fill="#FFD700" opacity="0.15"/>
  <circle cx="50" cy="35" r="22" fill="#FFD700" opacity="0.25"/>
  <circle cx="50" cy="35" r="18" fill="#FFD700"/>

  <!-- Fluffy clouds -->
  <g opacity="0.75">
    <ellipse cx="260" cy="30" rx="40" ry="13" fill="#fff"/>
    <ellipse cx="240" cy="27" rx="28" ry="12" fill="#fff"/>
    <ellipse cx="282" cy="27" rx="30" ry="11" fill="#fff"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="150" cy="22" rx="30" ry="10" fill="#fff"/>
    <ellipse cx="170" cy="20" rx="22" ry="9" fill="#fff"/>
  </g>

  <!-- Perfect green lawn -->
  <rect y="175" width="400" height="125" fill="url(#greenLawnFY)"/>
  <rect y="175" width="400" height="125" fill="url(#lawnStripesFY)"/>

  <!-- House - freshly painted -->
  <g filter="url(#houseShadow)">
    <rect x="115" y="55" width="170" height="120" fill="#ECEFF1"/>
  </g>

  <!-- Clean roof -->
  <polygon points="95,55 200,8 305,55" fill="url(#cleanRoof)"/>
  <!-- Fascia -->
  <rect x="105" y="50" width="190" height="8" fill="#B0BEC5"/>

  <!-- Door - freshly stained -->
  <rect x="178" y="108" width="44" height="67" fill="#5D4037" rx="2"/>
  <rect x="182" y="112" width="36" height="26" fill="#4E342E" rx="1"/>
  <rect x="182" y="142" width="36" height="26" fill="#4E342E" rx="1"/>
  <circle cx="213" cy="145" r="3" fill="#FFC107"/>
  <!-- Door frame -->
  <rect x="175" y="106" width="50" height="3" fill="#B0BEC5"/>

  <!-- Windows with shutters -->
  <rect x="125" y="78" width="5" height="36" fill="#1a472a" rx="1"/>
  <rect x="130" y="80" width="34" height="32" fill="#80DEEA" stroke="#546E7A" stroke-width="2"/>
  <rect x="164" y="78" width="5" height="36" fill="#1a472a" rx="1"/>
  <line x1="147" y1="80" x2="147" y2="112" stroke="#546E7A" stroke-width="1"/>
  <line x1="130" y1="96" x2="164" y2="96" stroke="#546E7A" stroke-width="1"/>
  <!-- Window reflection -->
  <rect x="133" y="83" width="8" height="10" fill="#fff" opacity="0.15" rx="1"/>

  <rect x="230" y="78" width="5" height="36" fill="#1a472a" rx="1"/>
  <rect x="235" y="80" width="34" height="32" fill="#80DEEA" stroke="#546E7A" stroke-width="2"/>
  <rect x="269" y="78" width="5" height="36" fill="#1a472a" rx="1"/>
  <line x1="252" y1="80" x2="252" y2="112" stroke="#546E7A" stroke-width="1"/>
  <line x1="235" y1="96" x2="269" y2="96" stroke="#546E7A" stroke-width="1"/>
  <rect x="238" y="83" width="8" height="10" fill="#fff" opacity="0.15" rx="1"/>

  <!-- Elegant stone walkway -->
  <rect x="180" y="175" width="40" height="125" fill="#CFD8DC" rx="2"/>
  <!-- Stone pattern -->
  <rect x="182" y="177" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="177" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="192" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="192" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="207" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="207" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="222" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="222" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="237" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="237" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="252" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="252" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="267" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="267" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="182" y="282" width="17" height="13" fill="#E0E0E0" rx="1" stroke="#90A4AE" stroke-width="0.5"/>
  <rect x="201" y="282" width="17" height="13" fill="#B0BEC5" rx="1" stroke="#90A4AE" stroke-width="0.5"/>

  <!-- Rounded shrubs along foundation -->
  <ellipse cx="140" cy="173" rx="16" ry="10" fill="#2E7D32"/>
  <ellipse cx="140" cy="170" rx="12" ry="8" fill="#388E3C"/>
  <ellipse cx="160" cy="173" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="160" cy="170" rx="10" ry="7" fill="#43A047"/>
  <ellipse cx="245" cy="173" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="245" cy="170" rx="10" ry="7" fill="#388E3C"/>
  <ellipse cx="265" cy="173" rx="16" ry="10" fill="#2E7D32"/>
  <ellipse cx="265" cy="170" rx="12" ry="8" fill="#43A047"/>

  <!-- Flower beds along walkway -->
  <!-- Left side -->
  <rect x="160" y="175" width="18" height="50" fill="#4E342E" rx="2"/>
  <circle cx="169" cy="178" r="4" fill="#E91E63"/>
  <circle cx="169" cy="178" r="2" fill="#F48FB1"/>
  <circle cx="169" cy="190" r="4.5" fill="#FF5722"/>
  <circle cx="169" cy="190" r="2.2" fill="#FFAB91"/>
  <circle cx="169" cy="202" r="4" fill="#9C27B0"/>
  <circle cx="169" cy="202" r="2" fill="#CE93D8"/>
  <circle cx="169" cy="214" r="4" fill="#E91E63"/>
  <circle cx="169" cy="214" r="2" fill="#F48FB1"/>
  <!-- Right side -->
  <rect x="222" y="175" width="18" height="50" fill="#4E342E" rx="2"/>
  <circle cx="231" cy="178" r="4" fill="#9C27B0"/>
  <circle cx="231" cy="178" r="2" fill="#CE93D8"/>
  <circle cx="231" cy="190" r="4.5" fill="#E91E63"/>
  <circle cx="231" cy="190" r="2.2" fill="#F48FB1"/>
  <circle cx="231" cy="202" r="4" fill="#FF5722"/>
  <circle cx="231" cy="202" r="2" fill="#FFAB91"/>
  <circle cx="231" cy="214" r="4" fill="#9C27B0"/>
  <circle cx="231" cy="214" r="2" fill="#CE93D8"/>

  <!-- Ornamental tree left -->
  <rect x="55" y="115" width="10" height="60" fill="#5D4037" rx="2"/>
  <circle cx="60" cy="95" r="28" fill="#2E7D32"/>
  <circle cx="60" cy="82" r="20" fill="#43A047"/>
  <circle cx="45" cy="100" r="16" fill="#388E3C"/>
  <circle cx="75" cy="98" r="18" fill="#388E3C"/>
  <circle cx="60" cy="75" r="12" fill="#66BB6A" opacity="0.5"/>

  <!-- Ornamental tree right -->
  <rect x="335" y="125" width="8" height="50" fill="#5D4037" rx="2"/>
  <circle cx="339" cy="108" r="22" fill="#2E7D32"/>
  <circle cx="339" cy="98" r="15" fill="#43A047"/>
  <circle cx="326" cy="112" r="13" fill="#388E3C"/>
  <circle cx="352" cy="110" r="14" fill="#388E3C"/>

  <!-- New decorative mailbox -->
  <rect x="345" y="155" width="5" height="28" fill="#5D4037" rx="1"/>
  <rect x="336" y="147" width="23" height="14" fill="#1a472a" rx="2"/>
  <rect x="338" y="149" width="19" height="10" fill="#2E7D32" rx="1"/>

  <!-- Landscape lighting -->
  <rect x="98" y="168" width="3" height="12" fill="#5D4037"/>
  <ellipse cx="99" cy="167" rx="4" ry="2" fill="#FFF176" opacity="0.5"/>
  <rect x="298" y="168" width="3" height="12" fill="#5D4037"/>
  <ellipse cx="299" cy="167" rx="4" ry="2" fill="#FFF176" opacity="0.5"/>

  <!-- Clean gutter -->
  <rect x="105" y="46" width="3" height="130" fill="#B0BEC5" opacity="0.4"/>
  <rect x="290" y="46" width="3" height="130" fill="#B0BEC5" opacity="0.4"/>

  <!-- Address numbers on house -->
  <text x="200" y="103" font-family="Arial" font-size="10" fill="#546E7A" text-anchor="middle" font-weight="bold">1247</text>
</svg>
