<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="370" cy="35" r="25" fill="#FFD700"/>
  <!-- Green lawn -->
  <rect y="200" width="400" height="100" fill="#4CAF50"/>
  <!-- Commercial building -->
  <rect x="50" y="50" width="300" height="150" fill="#ECEFF1"/>
  <!-- Windows row 1 -->
  <rect x="75" y="70" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="130" y="70" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="185" y="70" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="240" y="70" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="295" y="70" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <!-- Windows row 2 -->
  <rect x="75" y="120" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="130" y="120" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="185" y="120" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="240" y="120" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <rect x="295" y="120" width="35" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="180" y="160" width="40" height="40" fill="#455A64"/>
  <circle cx="214" cy="180" r="2" fill="#FFC107"/>
  <!-- Landscaped entrance shrubs -->
  <circle cx="165" cy="195" r="12" fill="#2E7D32"/>
  <circle cx="235" cy="195" r="12" fill="#2E7D32"/>
  <circle cx="165" cy="190" r="8" fill="#43A047"/>
  <circle cx="235" cy="190" r="8" fill="#43A047"/>
  <!-- Trimmed hedges along building -->
  <rect x="55" y="188" width="100" height="14" rx="7" fill="#2E7D32"/>
  <rect x="245" y="188" width="100" height="14" rx="7" fill="#2E7D32"/>
  <!-- Trees -->
  <rect x="22" y="140" width="8" height="60" fill="#5D4037"/>
  <circle cx="26" cy="120" r="22" fill="#2E7D32"/>
  <circle cx="26" cy="110" r="15" fill="#43A047"/>
  <rect x="370" y="140" width="8" height="60" fill="#5D4037"/>
  <circle cx="374" cy="120" r="22" fill="#2E7D32"/>
  <circle cx="374" cy="110" r="15" fill="#43A047"/>
  <!-- Flower beds -->
  <circle cx="70" cy="205" r="4" fill="#E91E63"/>
  <circle cx="85" cy="207" r="4" fill="#FF5722"/>
  <circle cx="100" cy="205" r="4" fill="#9C27B0"/>
  <circle cx="300" cy="205" r="4" fill="#E91E63"/>
  <circle cx="315" cy="207" r="4" fill="#FF5722"/>
  <circle cx="330" cy="205" r="4" fill="#9C27B0"/>
  <!-- Clean walkway -->
  <rect x="185" y="200" width="30" height="100" rx="2" fill="#B0BEC5"/>
  <!-- Nice sign -->
  <rect x="15" y="150" width="6" height="50" fill="#5D4037" rx="1"/>
  <rect x="2" y="138" width="32" height="20" rx="3" fill="#1a472a"/>
  <rect x="6" y="142" width="24" height="12" rx="2" fill="#2E7D32"/>
  <!-- Clouds -->
  <ellipse cx="150" cy="30" rx="50" ry="15" fill="#fff" opacity="0.7"/>
  <ellipse cx="280" cy="25" rx="40" ry="12" fill="#fff" opacity="0.6"/>
</svg>
