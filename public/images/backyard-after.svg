<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="blueSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6e8"/>
      <stop offset="100%" stop-color="#a8d8f0"/>
    </linearGradient>
    <linearGradient id="lushGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aad52"/>
      <stop offset="100%" stop-color="#3a8a42"/>
    </linearGradient>
    <linearGradient id="treeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45a049"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <pattern id="grassStripe" width="400" height="30" patternUnits="userSpaceOnUse">
      <rect width="400" height="15" fill="#45a84d" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Beautiful blue sky -->
  <rect width="400" height="300" fill="url(#blueSky)"/>

  <!-- Sun with glow -->
  <circle cx="345" cy="45" r="38" fill="#FFD700" opacity="0.15"/>
  <circle cx="345" cy="45" r="28" fill="#FFD700" opacity="0.3"/>
  <circle cx="345" cy="45" r="22" fill="#FFD700"/>

  <!-- Fluffy white clouds -->
  <g opacity="0.8">
    <ellipse cx="80" cy="38" rx="35" ry="12" fill="#fff"/>
    <ellipse cx="60" cy="35" rx="25" ry="14" fill="#fff"/>
    <ellipse cx="100" cy="34" rx="28" ry="11" fill="#fff"/>
  </g>
  <g opacity="0.65">
    <ellipse cx="220" cy="28" rx="40" ry="13" fill="#fff"/>
    <ellipse cx="200" cy="24" rx="28" ry="12" fill="#fff"/>
    <ellipse cx="245" cy="25" rx="30" ry="10" fill="#fff"/>
  </g>

  <!-- Distant lush treeline -->
  <circle cx="15" cy="138" r="20" fill="#388E3C" opacity="0.5"/>
  <circle cx="45" cy="132" r="25" fill="#2E7D32" opacity="0.45"/>
  <circle cx="80" cy="135" r="18" fill="#388E3C" opacity="0.5"/>
  <circle cx="300" cy="134" r="22" fill="#2E7D32" opacity="0.45"/>
  <circle cx="335" cy="137" r="18" fill="#388E3C" opacity="0.5"/>
  <circle cx="370" cy="133" r="20" fill="#2E7D32" opacity="0.48"/>

  <!-- Lush green lawn -->
  <rect y="165" width="400" height="135" fill="url(#lushGrass)"/>
  <!-- Lawn mow stripes -->
  <rect y="170" width="400" height="135" fill="url(#grassStripe)"/>

  <!-- Beautiful healthy tree -->
  <rect x="190" y="95" width="16" height="70" fill="#5D4037" rx="3" filter="url(#softShadow)"/>
  <!-- Bark detail -->
  <line x1="194" y1="100" x2="194" y2="165" stroke="#4E342E" stroke-width="0.8" opacity="0.4"/>
  <line x1="200" y1="98" x2="200" y2="163" stroke="#4E342E" stroke-width="0.6" opacity="0.35"/>
  <!-- Lush canopy -->
  <circle cx="198" cy="70" r="42" fill="#2E7D32"/>
  <circle cx="168" cy="85" r="28" fill="#388E3C"/>
  <circle cx="232" cy="82" r="30" fill="#388E3C"/>
  <circle cx="198" cy="55" r="28" fill="#43A047"/>
  <circle cx="180" cy="65" r="22" fill="url(#treeTop)"/>
  <circle cx="218" cy="62" r="24" fill="url(#treeTop)"/>
  <!-- Leaf highlights -->
  <circle cx="185" cy="52" r="8" fill="#66BB6A" opacity="0.5"/>
  <circle cx="210" cy="58" r="6" fill="#66BB6A" opacity="0.4"/>
  <circle cx="175" cy="78" r="5" fill="#66BB6A" opacity="0.35"/>

  <!-- Curved stone path -->
  <path d="M285 165 Q300 200 295 230 Q290 260 300 300" fill="none" stroke="#B0BEC5" stroke-width="32" stroke-linecap="round" opacity="0.7"/>
  <!-- Individual stepping stones -->
  <ellipse cx="288" cy="180" rx="16" ry="9" fill="#B0BEC5" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="295" cy="200" rx="16" ry="9" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="293" cy="220" rx="16" ry="9" fill="#B0BEC5" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="290" cy="240" rx="16" ry="9" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="292" cy="260" rx="16" ry="9" fill="#B0BEC5" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="296" cy="280" rx="16" ry="9" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/>

  <!-- Garden bed with mulch along left side -->
  <path d="M10 165 L140 165 L140 200 Q75 210 10 200 Z" fill="#4E342E"/>
  <!-- Mulch texture -->
  <ellipse cx="30" cy="182" rx="4" ry="2" fill="#3E2723" opacity="0.5"/>
  <ellipse cx="55" cy="178" rx="5" ry="2" fill="#3E2723" opacity="0.4"/>
  <ellipse cx="90" cy="185" rx="4" ry="2" fill="#3E2723" opacity="0.45"/>
  <ellipse cx="115" cy="180" rx="5" ry="2" fill="#3E2723" opacity="0.5"/>

  <!-- Flowers in garden bed - row 1 (tall) -->
  <line x1="25" y1="172" x2="25" y2="158" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="25" cy="155" r="6" fill="#E91E63"/>
  <circle cx="25" cy="155" r="3" fill="#F48FB1"/>
  <line x1="50" y1="172" x2="50" y2="155" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="50" cy="152" r="7" fill="#FF5722"/>
  <circle cx="50" cy="152" r="3.5" fill="#FFAB91"/>
  <line x1="75" y1="172" x2="75" y2="156" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="75" cy="153" r="6" fill="#9C27B0"/>
  <circle cx="75" cy="153" r="3" fill="#CE93D8"/>
  <line x1="100" y1="172" x2="100" y2="158" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="100" cy="155" r="6" fill="#E91E63"/>
  <circle cx="100" cy="155" r="3" fill="#F48FB1"/>
  <line x1="125" y1="172" x2="125" y2="155" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="125" cy="152" r="7" fill="#FF5722"/>
  <circle cx="125" cy="152" r="3.5" fill="#FFAB91"/>

  <!-- Low shrubs behind flowers -->
  <ellipse cx="40" cy="165" rx="18" ry="8" fill="#388E3C"/>
  <ellipse cx="85" cy="165" rx="20" ry="9" fill="#2E7D32"/>
  <ellipse cx="125" cy="165" rx="16" ry="7" fill="#388E3C"/>

  <!-- New cedar fence -->
  <g filter="url(#softShadow)">
    <rect x="8" y="128" width="7" height="42" fill="#8D6E63" rx="1"/>
    <rect x="58" y="128" width="7" height="42" fill="#8D6E63" rx="1"/>
    <rect x="108" y="128" width="7" height="42" fill="#8D6E63" rx="1"/>
    <rect x="158" y="128" width="7" height="42" fill="#8D6E63" rx="1"/>
    <!-- Rails -->
    <rect x="8" y="138" width="157" height="5" fill="#8D6E63" rx="1"/>
    <rect x="8" y="155" width="157" height="5" fill="#8D6E63" rx="1"/>
    <!-- Pickets -->
    <rect x="18" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="28" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="38" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="48" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="68" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="78" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="88" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="98" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="118" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="128" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="138" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
    <rect x="148" y="132" width="5" height="35" fill="#A1887F" rx="0.5"/>
  </g>

  <!-- Bird bath -->
  <rect x="345" cy="180" width="4" height="20" fill="#90A4AE" x="353" y="165"/>
  <ellipse cx="355" cy="165" rx="14" ry="4" fill="#B0BEC5" stroke="#90A4AE" stroke-width="1"/>
  <ellipse cx="355" cy="164" rx="11" ry="3" fill="#81D4FA" opacity="0.5"/>

  <!-- Butterfly -->
  <ellipse cx="160" cy="135" rx="5" ry="3" fill="#FF9800" transform="rotate(-20 160 135)" opacity="0.7"/>
  <ellipse cx="152" cy="133" rx="5" ry="3" fill="#FF9800" transform="rotate(20 152 133)" opacity="0.7"/>
  <circle cx="156" cy="134" r="1" fill="#5D4037"/>

  <!-- Small decorative rock border along path -->
  <circle cx="270" cy="182" r="4" fill="#9E9E9E"/>
  <circle cx="274" cy="202" r="3.5" fill="#BDBDBD"/>
  <circle cx="272" cy="222" r="4" fill="#9E9E9E"/>
  <circle cx="269" cy="242" r="3.5" fill="#BDBDBD"/>
  <circle cx="310" cy="188" r="3.5" fill="#9E9E9E"/>
  <circle cx="314" cy="208" r="4" fill="#BDBDBD"/>
  <circle cx="312" cy="228" r="3.5" fill="#9E9E9E"/>
  <circle cx="310" cy="248" r="4" fill="#BDBDBD"/>
</svg>
