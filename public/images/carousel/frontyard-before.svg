<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="graySkyFY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a8b0"/>
      <stop offset="100%" stop-color="#c5c9ce"/>
    </linearGradient>
    <linearGradient id="patchyLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0915e"/>
      <stop offset="100%" stop-color="#8a7a4e"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
  </defs>

  <!-- Overcast sky -->
  <rect width="400" height="300" fill="url(#graySkyFY)"/>

  <!-- Clouds -->
  <ellipse cx="90" cy="30" rx="55" ry="18" fill="#aeb3b8" opacity="0.6"/>
  <ellipse cx="250" cy="25" rx="70" ry="22" fill="#b3b8bc" opacity="0.55"/>
  <ellipse cx="370" cy="35" rx="45" ry="16" fill="#aeb3b8" opacity="0.5"/>

  <!-- Patchy dead lawn -->
  <rect y="175" width="400" height="125" fill="url(#patchyLawn)"/>

  <!-- Bare dirt patches -->
  <ellipse cx="85" cy="215" rx="42" ry="18" fill="#8B7355" opacity="0.7"/>
  <ellipse cx="260" cy="208" rx="50" ry="16" fill="#8B7355" opacity="0.65"/>
  <ellipse cx="55" cy="255" rx="38" ry="15" fill="#8B7355" opacity="0.6"/>
  <ellipse cx="340" cy="248" rx="35" ry="13" fill="#8B7355" opacity="0.55"/>
  <ellipse cx="180" cy="270" rx="45" ry="14" fill="#8B7355" opacity="0.5"/>

  <!-- Sparse green patches -->
  <ellipse cx="170" cy="220" rx="28" ry="10" fill="#8a9e5e" opacity="0.6"/>
  <ellipse cx="320" cy="265" rx="22" ry="9" fill="#8a9e5e" opacity="0.5"/>
  <ellipse cx="390" cy="225" rx="18" ry="8" fill="#8a9e5e" opacity="0.55"/>

  <!-- Weeds scattered -->
  <g stroke="#6b7c3f" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="200" x2="35" y2="185"/>
    <line x1="43" y1="200" x2="48" y2="183"/>
    <line x1="130" y1="210" x2="126" y2="196"/>
    <line x1="330" y1="205" x2="326" y2="190"/>
    <line x1="333" y1="205" x2="338" y2="188"/>
    <line x1="375" y1="215" x2="370" y2="200"/>
  </g>

  <!-- House - worn appearance -->
  <rect x="115" y="55" width="170" height="120" fill="#a8b0b8"/>
  <!-- Faded/stained walls -->
  <rect x="115" y="140" width="170" height="35" fill="#9da5ad" opacity="0.5"/>
  <!-- Water stain streaks -->
  <line x1="145" y1="55" x2="143" y2="90" stroke="#96a0a8" stroke-width="3" opacity="0.3"/>
  <line x1="240" y1="55" x2="242" y2="85" stroke="#96a0a8" stroke-width="2.5" opacity="0.25"/>

  <!-- Roof -->
  <polygon points="95,55 200,8 305,55" fill="url(#roofGrad)"/>
  <!-- Missing shingle patches -->
  <rect x="150" y="28" width="12" height="8" fill="#4a5a64" transform="rotate(-22 156 32)" opacity="0.5"/>
  <rect x="230" y="32" width="10" height="7" fill="#4a5a64" transform="rotate(22 235 35)" opacity="0.45"/>

  <!-- Fascia board -->
  <rect x="105" y="50" width="190" height="8" fill="#78909C"/>

  <!-- Door - faded paint -->
  <rect x="178" y="108" width="44" height="67" fill="#5a4035" rx="1"/>
  <rect x="181" y="111" width="38" height="28" fill="#4d3a2e" rx="1"/>
  <rect x="181" y="142" width="38" height="28" fill="#4d3a2e" rx="1"/>
  <circle cx="215" cy="145" r="3" fill="#B8A080"/>

  <!-- Windows - dirty/dated -->
  <rect x="130" y="80" width="34" height="32" fill="#7aAaBA" opacity="0.6" stroke="#546E7A" stroke-width="2"/>
  <line x1="147" y1="80" x2="147" y2="112" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="130" y1="96" x2="164" y2="96" stroke="#546E7A" stroke-width="1.5"/>
  <!-- Dirty smudge -->
  <ellipse cx="140" cy="88" rx="5" ry="4" fill="#6a8a9a" opacity="0.3"/>

  <rect x="236" y="80" width="34" height="32" fill="#7aAaBA" opacity="0.6" stroke="#546E7A" stroke-width="2"/>
  <line x1="253" y1="80" x2="253" y2="112" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="236" y1="96" x2="270" y2="96" stroke="#546E7A" stroke-width="1.5"/>
  <ellipse cx="260" cy="90" rx="4" ry="3" fill="#6a8a9a" opacity="0.25"/>

  <!-- Cracked concrete walkway -->
  <rect x="183" y="175" width="34" height="125" fill="#9a9a9a"/>
  <!-- Cracks -->
  <path d="M190 185 L195 210 L188 235 L193 260 L190 285" stroke="#7a7a7a" stroke-width="1.5" fill="none"/>
  <path d="M210 190 L207 220 L212 245" stroke="#7a7a7a" stroke-width="1" fill="none"/>
  <line x1="183" y1="220" x2="217" y2="224" stroke="#7a7a7a" stroke-width="1"/>
  <line x1="183" y1="255" x2="217" y2="252" stroke="#7a7a7a" stroke-width="1"/>
  <!-- Weed in crack -->
  <line x1="195" y1="230" x2="192" y2="222" stroke="#6b7c3f" stroke-width="1.2"/>
  <line x1="195" y1="230" x2="198" y2="220" stroke="#6b7c3f" stroke-width="1.2"/>

  <!-- Old overgrown bushes (scraggly) -->
  <ellipse cx="140" cy="172" rx="18" ry="10" fill="#6a7a4a" opacity="0.7"/>
  <ellipse cx="140" cy="168" rx="12" ry="7" fill="#5a6a3a" opacity="0.6"/>
  <!-- Stray branches poking out -->
  <line x1="128" y1="165" x2="120" y2="155" stroke="#5a5a3a" stroke-width="1.5"/>
  <line x1="152" y1="163" x2="160" y2="152" stroke="#5a5a3a" stroke-width="1.5"/>

  <ellipse cx="260" cy="172" rx="18" ry="10" fill="#6a7a4a" opacity="0.7"/>
  <ellipse cx="260" cy="168" rx="12" ry="7" fill="#5a6a3a" opacity="0.6"/>
  <line x1="248" y1="164" x2="242" y2="153" stroke="#5a5a3a" stroke-width="1.5"/>
  <line x1="272" y1="165" x2="278" y2="154" stroke="#5a5a3a" stroke-width="1.5"/>

  <!-- Rusty mailbox -->
  <rect x="345" y="160" width="4" height="35" fill="#7a6a5a"/>
  <rect x="335" y="152" width="25" height="16" fill="#8a6a4a" rx="2"/>
  <rect x="335" y="150" width="25" height="4" fill="#7a5a3a" rx="1"/>
  <!-- Rust -->
  <circle cx="342" cy="160" r="2" fill="#6a4a2a" opacity="0.4"/>

  <!-- Overflowing gutter -->
  <rect x="105" y="46" width="4" height="130" fill="#6a7a8a" opacity="0.3"/>
  <ellipse cx="107" cy="175" rx="6" ry="3" fill="#5a6a3a" opacity="0.4"/>

  <!-- Newspaper on walkway -->
  <rect x="192" y="190" width="12" height="8" fill="#d5d0c5" transform="rotate(15 198 194)" opacity="0.6"/>
</svg>
