<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="graySkyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa2aa"/>
      <stop offset="100%" stop-color="#c0c4c8"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5adb5"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
  </defs>

  <!-- Overcast sky -->
  <rect width="400" height="300" fill="url(#graySkyC)"/>
  <ellipse cx="120" cy="28" rx="65" ry="20" fill="#aeb3b8" opacity="0.5"/>
  <ellipse cx="320" cy="22" rx="50" ry="16" fill="#b0b5ba" opacity="0.45"/>

  <!-- Ground - neglected -->
  <rect y="200" width="400" height="100" fill="#a0916a"/>

  <!-- Bare dirt patches -->
  <ellipse cx="75" cy="240" rx="48" ry="18" fill="#8B7355" opacity="0.7"/>
  <ellipse cx="240" cy="250" rx="55" ry="16" fill="#8B7355" opacity="0.65"/>
  <ellipse cx="365" cy="235" rx="38" ry="14" fill="#8B7355" opacity="0.6"/>
  <ellipse cx="160" cy="275" rx="42" ry="15" fill="#8B7355" opacity="0.5"/>
  <ellipse cx="330" cy="280" rx="35" ry="12" fill="#8B7355" opacity="0.55"/>

  <!-- Sparse grass -->
  <ellipse cx="140" cy="230" rx="20" ry="8" fill="#8a9e5e" opacity="0.5"/>
  <ellipse cx="310" cy="260" rx="18" ry="7" fill="#8a9e5e" opacity="0.45"/>

  <!-- Commercial building - weathered -->
  <rect x="45" y="48" width="310" height="152" fill="url(#buildingGrad)"/>
  <!-- Weathering/staining -->
  <rect x="45" y="165" width="310" height="35" fill="#9aa2aa" opacity="0.3"/>
  <ellipse cx="100" cy="120" rx="18" ry="25" fill="#9da5ad" opacity="0.15"/>
  <ellipse cx="280" cy="130" rx="15" ry="20" fill="#9da5ad" opacity="0.12"/>

  <!-- Roof edge -->
  <rect x="40" y="42" width="320" height="10" fill="#78909C"/>

  <!-- Windows row 1 - some dingy -->
  <rect x="70" y="65" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>
  <rect x="128" y="65" width="38" height="32" fill="#7aaaba" opacity="0.5" stroke="#78909C" stroke-width="1.5"/>
  <rect x="186" y="65" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>
  <rect x="244" y="65" width="38" height="32" fill="#7aaaba" opacity="0.5" stroke="#78909C" stroke-width="1.5"/>
  <rect x="302" y="65" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>
  <!-- Dirty window smudges -->
  <ellipse cx="82" cy="78" rx="5" ry="6" fill="#6a8a9a" opacity="0.2"/>
  <ellipse cx="310" cy="80" rx="4" ry="5" fill="#6a8a9a" opacity="0.18"/>

  <!-- Windows row 2 -->
  <rect x="70" y="115" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>
  <rect x="128" y="115" width="38" height="32" fill="#7aaaba" opacity="0.5" stroke="#78909C" stroke-width="1.5"/>
  <rect x="186" y="115" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>
  <rect x="244" y="115" width="38" height="32" fill="#7aaaba" opacity="0.5" stroke="#78909C" stroke-width="1.5"/>
  <rect x="302" y="115" width="38" height="32" fill="#7aaaba" opacity="0.45" stroke="#78909C" stroke-width="1.5"/>

  <!-- Door - worn -->
  <rect x="178" y="160" width="44" height="40" fill="#4a5a64"/>
  <rect x="180" y="162" width="18" height="15" fill="#3a4a54" rx="1"/>
  <rect x="202" y="162" width="18" height="15" fill="#3a4a54" rx="1"/>

  <!-- Overgrown weeds along building -->
  <g stroke="#6b7c3f" stroke-width="2.5" stroke-linecap="round">
    <line x1="48" y1="200" x2="40" y2="172"/>
    <line x1="53" y1="200" x2="58" y2="168"/>
    <line x1="58" y1="200" x2="52" y2="175"/>
    <line x1="348" y1="200" x2="342" y2="170"/>
    <line x1="353" y1="200" x2="360" y2="172"/>
    <line x1="343" y1="200" x2="338" y2="176"/>
    <line x1="358" y1="200" x2="365" y2="174"/>
  </g>
  <!-- Tall weeds in walkway cracks -->
  <g stroke="#6b7c3f" stroke-width="1.5" stroke-linecap="round">
    <line x1="195" y1="230" x2="192" y2="218"/>
    <line x1="205" y1="235" x2="208" y2="222"/>
  </g>

  <!-- Neglected sign post -->
  <rect x="14" y="140" width="6" height="62" fill="#6a5a4a"/>
  <rect x="14" y="138" width="6" height="5" fill="#5a4a3a" transform="rotate(3 17 140)"/>
  <!-- Faded sign -->
  <rect x="2" y="125" width="48" height="22" fill="#8a7a6a" rx="2"/>
  <!-- Peeling paint -->
  <rect x="8" y="130" width="36" height="12" fill="#9a8a7a" rx="1"/>
  <rect x="12" y="132" width="10" height="4" fill="#8a7a6a" opacity="0.5"/>

  <!-- Faded parking lines -->
  <line x1="130" y1="260" x2="130" y2="300" stroke="#8a8a6e" stroke-width="2" opacity="0.3"/>
  <line x1="195" y1="260" x2="195" y2="300" stroke="#8a8a6e" stroke-width="2" opacity="0.3"/>
  <line x1="260" y1="260" x2="260" y2="300" stroke="#8a8a6e" stroke-width="2" opacity="0.3"/>

  <!-- Cracked walkway to door -->
  <rect x="185" y="200" width="30" height="60" fill="#8a8a8a"/>
  <path d="M192 205 L195 225 L190 245 L194 255" stroke="#707070" stroke-width="1.5" fill="none"/>
  <line x1="185" y1="230" x2="215" y2="233" stroke="#707070" stroke-width="1" opacity="0.7"/>

  <!-- Litter / debris -->
  <rect x="110" y="235" width="8" height="5" fill="#c5c0b5" transform="rotate(25 114 237)" opacity="0.5"/>
  <ellipse cx="280" cy="245" rx="3" ry="2" fill="#7a6a45" transform="rotate(15 280 245)" opacity="0.4"/>

  <!-- Overflowing trash can -->
  <rect x="370" y="185" width="18" height="20" fill="#5a5a5a"/>
  <rect x="368" y="183" width="22" height="4" fill="#4a4a4a" rx="1"/>
  <rect x="375" y="178" width="8" height="8" fill="#8a7a5a" transform="rotate(15 379 182)" opacity="0.6"/>
</svg>
