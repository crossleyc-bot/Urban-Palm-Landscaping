<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="overcastSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9da5ae"/>
      <stop offset="100%" stop-color="#c9ccd0"/>
    </linearGradient>
    <linearGradient id="deadGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a8a5e"/>
      <stop offset="100%" stop-color="#7a6a45"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <pattern id="dirtTexture" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.8" fill="#6d5a3c" opacity="0.3"/>
      <circle cx="6" cy="7" r="0.6" fill="#7a6545" opacity="0.2"/>
      <circle cx="5" cy="1" r="0.5" fill="#6d5a3c" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Overcast sky -->
  <rect width="400" height="300" fill="url(#overcastSky)"/>

  <!-- Heavy gray clouds -->
  <ellipse cx="70" cy="35" rx="65" ry="22" fill="#a8adb2" opacity="0.7"/>
  <ellipse cx="120" cy="45" rx="50" ry="18" fill="#b0b5ba" opacity="0.6"/>
  <ellipse cx="230" cy="30" rx="80" ry="28" fill="#a5aab0" opacity="0.65"/>
  <ellipse cx="310" cy="50" rx="55" ry="20" fill="#b3b8bc" opacity="0.5"/>
  <ellipse cx="370" cy="35" rx="40" ry="15" fill="#a8adb2" opacity="0.55"/>

  <!-- Distant treeline (bare/scraggly) -->
  <rect x="0" y="130" width="400" height="40" fill="#6a7a5a" opacity="0.35"/>
  <circle cx="30" cy="130" r="18" fill="#5a6a4a" opacity="0.4"/>
  <circle cx="80" cy="125" r="22" fill="#5d6d4d" opacity="0.35"/>
  <circle cx="140" cy="128" r="16" fill="#5a6a4a" opacity="0.38"/>
  <circle cx="320" cy="127" r="20" fill="#5d6d4d" opacity="0.35"/>
  <circle cx="380" cy="130" r="15" fill="#5a6a4a" opacity="0.4"/>

  <!-- Ground - dried/dead lawn -->
  <rect y="165" width="400" height="135" fill="url(#deadGrass)"/>
  <rect y="165" width="400" height="135" fill="url(#dirtTexture)"/>

  <!-- Bare dirt patches -->
  <ellipse cx="70" cy="210" rx="45" ry="16" fill="#7a6545" opacity="0.7"/>
  <ellipse cx="200" cy="250" rx="55" ry="18" fill="#6d5a3c" opacity="0.6"/>
  <ellipse cx="320" cy="220" rx="40" ry="14" fill="#7a6545" opacity="0.65"/>
  <ellipse cx="140" cy="270" rx="50" ry="15" fill="#6d5a3c" opacity="0.5"/>
  <ellipse cx="360" cy="265" rx="35" ry="12" fill="#7a6545" opacity="0.55"/>

  <!-- Scattered weeds and dead grass tufts -->
  <g stroke="#6b7c3f" stroke-width="1.5" stroke-linecap="round">
    <line x1="50" y1="195" x2="45" y2="178"/>
    <line x1="53" y1="195" x2="58" y2="175"/>
    <line x1="56" y1="195" x2="52" y2="180"/>
    <line x1="150" y1="200" x2="145" y2="185"/>
    <line x1="153" y1="200" x2="158" y2="183"/>
    <line x1="290" y1="195" x2="285" y2="178"/>
    <line x1="293" y1="195" x2="298" y2="176"/>
    <line x1="380" y1="200" x2="375" y2="185"/>
    <line x1="383" y1="200" x2="388" y2="182"/>
  </g>
  <!-- Brown dead tufts -->
  <g stroke="#8a7a55" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="230" x2="95" y2="218"/>
    <line x1="103" y1="230" x2="108" y2="216"/>
    <line x1="250" y1="210" x2="248" y2="196"/>
    <line x1="253" y1="210" x2="256" y2="198"/>
    <line x1="340" y1="240" x2="337" y2="228"/>
  </g>

  <!-- Dead tree with detailed bark -->
  <rect x="192" y="85" width="14" height="80" fill="#5c4a32" rx="2"/>
  <!-- Bark texture -->
  <line x1="195" y1="90" x2="195" y2="160" stroke="#4d3d28" stroke-width="0.7" opacity="0.5"/>
  <line x1="200" y1="88" x2="200" y2="165" stroke="#4d3d28" stroke-width="0.5" opacity="0.4"/>
  <line x1="203" y1="92" x2="203" y2="158" stroke="#4d3d28" stroke-width="0.6" opacity="0.45"/>
  <!-- Main branches (bare) -->
  <line x1="199" y1="110" x2="165" y2="80" stroke="#5c4a32" stroke-width="6" stroke-linecap="round"/>
  <line x1="199" y1="100" x2="240" y2="70" stroke="#5c4a32" stroke-width="5" stroke-linecap="round"/>
  <line x1="199" y1="125" x2="235" y2="105" stroke="#5c4a32" stroke-width="4" stroke-linecap="round"/>
  <line x1="199" y1="118" x2="170" y2="100" stroke="#5c4a32" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Smaller branches -->
  <line x1="172" y1="87" x2="155" y2="70" stroke="#5c4a32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="172" y1="87" x2="160" y2="80" stroke="#5c4a32" stroke-width="2" stroke-linecap="round"/>
  <line x1="232" y1="76" x2="250" y2="62" stroke="#5c4a32" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="232" y1="76" x2="245" y2="70" stroke="#5c4a32" stroke-width="2" stroke-linecap="round"/>
  <line x1="230" y1="110" x2="248" y2="100" stroke="#5c4a32" stroke-width="2" stroke-linecap="round"/>
  <!-- Few dead leaves clinging -->
  <ellipse cx="158" cy="72" rx="3" ry="5" fill="#8a7a55" transform="rotate(-20 158 72)" opacity="0.6"/>
  <ellipse cx="247" cy="64" rx="3" ry="5" fill="#8a7a55" transform="rotate(15 247 64)" opacity="0.5"/>

  <!-- Broken wooden fence -->
  <!-- Posts -->
  <rect x="8" y="132" width="7" height="38" fill="#8a7a60" rx="1"/>
  <rect x="58" y="137" width="7" height="35" fill="#8a7a60" rx="1" transform="rotate(6 61 155)"/>
  <rect x="108" y="132" width="7" height="38" fill="#8a7a60" rx="1"/>
  <rect x="158" y="140" width="7" height="30" fill="#8a7a60" rx="1" transform="rotate(-4 161 155)"/>
  <!-- Rails (some broken/sagging) -->
  <rect x="8" y="142" width="105" height="4" fill="#8a7a60" rx="1"/>
  <line x1="8" y1="157" x2="65" y2="160" stroke="#8a7a60" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="160" x2="113" y2="158" stroke="#8a7a60" stroke-width="4" stroke-linecap="round"/>
  <!-- Broken section -->
  <line x1="113" y1="143" x2="145" y2="148" stroke="#8a7a60" stroke-width="4" stroke-linecap="round"/>
  <!-- Missing pickets show gap -->
  <rect x="18" y="138" width="4" height="25" fill="#7a6a50" rx="0.5"/>
  <rect x="28" y="138" width="4" height="25" fill="#7a6a50" rx="0.5"/>
  <rect x="38" y="138" width="4" height="22" fill="#7a6a50" rx="0.5" transform="rotate(3 40 150)"/>
  <rect x="68" y="140" width="4" height="24" fill="#7a6a50" rx="0.5" transform="rotate(5 70 150)"/>
  <rect x="78" y="139" width="4" height="25" fill="#7a6a50" rx="0.5"/>
  <rect x="98" y="138" width="4" height="25" fill="#7a6a50" rx="0.5"/>
  <!-- Missing picket gap between 38 and 68 -->

  <!-- Rusty old wheelbarrow -->
  <ellipse cx="330" cy="188" rx="22" ry="14" fill="#8a6a4a"/>
  <ellipse cx="330" cy="186" rx="20" ry="12" fill="#9a7a5a"/>
  <line x1="310" y1="185" x2="295" y2="195" stroke="#6a5a3a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="350" y1="185" x2="365" y2="195" stroke="#6a5a3a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="352" cy="196" r="7" fill="none" stroke="#6a5a3a" stroke-width="2"/>
  <!-- Rust spots -->
  <circle cx="325" cy="184" r="2" fill="#7a5a3a" opacity="0.5"/>
  <circle cx="338" cy="187" r="1.5" fill="#7a5a3a" opacity="0.4"/>

  <!-- Old garden hose coiled on ground -->
  <path d="M370 240 Q380 230 375 220 Q368 212 358 218 Q350 225 358 232 Q365 238 370 240" fill="none" stroke="#4a7a5a" stroke-width="3" opacity="0.6"/>

  <!-- Scattered debris / leaves -->
  <ellipse cx="110" cy="245" rx="3" ry="2" fill="#7a6a45" transform="rotate(30 110 245)" opacity="0.5"/>
  <ellipse cx="175" cy="225" rx="3" ry="2" fill="#6d5a3c" transform="rotate(-20 175 225)" opacity="0.4"/>
  <ellipse cx="270" cy="260" rx="3" ry="2" fill="#7a6a45" transform="rotate(45 270 260)" opacity="0.5"/>
  <ellipse cx="230" cy="235" rx="2.5" ry="1.8" fill="#6d5a3c" transform="rotate(10 230 235)" opacity="0.45"/>

  <!-- Muddy puddle -->
  <ellipse cx="130" cy="240" rx="20" ry="8" fill="#5a4a2c" opacity="0.4"/>
  <ellipse cx="130" cy="240" rx="16" ry="6" fill="#6a5a3c" opacity="0.3"/>
</svg>
