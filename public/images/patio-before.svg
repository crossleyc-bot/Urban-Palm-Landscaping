<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#c9ccd0"/>
  <!-- Ground -->
  <rect y="160" width="400" height="140" fill="#8B7355"/>
  <!-- Cracked concrete patio -->
  <rect x="30" y="160" width="250" height="130" fill="#9E9E9E"/>
  <!-- Cracks -->
  <path d="M80 160 L95 200 L85 240 L90 290" stroke="#757575" stroke-width="2" fill="none"/>
  <path d="M180 160 L175 190 L190 230 L185 260 L195 290" stroke="#757575" stroke-width="2" fill="none"/>
  <path d="M30 210 L100 215 L180 205 L280 212" stroke="#757575" stroke-width="2" fill="none"/>
  <path d="M120 160 L125 180 L115 200" stroke="#757575" stroke-width="1.5" fill="none"/>
  <!-- Stains -->
  <ellipse cx="130" cy="230" rx="25" ry="15" fill="#8a8a8a" opacity="0.5"/>
  <ellipse cx="220" cy="200" rx="20" ry="12" fill="#8a8a8a" opacity="0.4"/>
  <!-- Old furniture -->
  <rect x="50" y="175" width="40" height="40" fill="#6D4C41" rx="2"/>
  <rect x="46" y="172" width="48" height="5" fill="#795548" rx="1"/>
  <!-- Weedy edge -->
  <line x1="290" y1="160" x2="285" y2="140" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="300" y1="160" x2="305" y2="138" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="310" y1="160" x2="308" y2="142" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="330" y1="160" x2="325" y2="140" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="350" y1="160" x2="355" y2="135" stroke="#6b7c3f" stroke-width="2"/>
  <!-- House wall -->
  <rect x="0" y="40" width="280" height="120" fill="#B0BEC5"/>
  <rect x="0" y="35" width="280" height="10" fill="#90A4AE"/>
  <!-- Sliding door -->
  <rect x="100" y="55" width="80" height="105" fill="#80DEEA" opacity="0.5" stroke="#78909C" stroke-width="2"/>
  <line x1="140" y1="55" x2="140" y2="160" stroke="#78909C" stroke-width="2"/>
</svg>
