<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#c9ccd0"/>
  <!-- Ground -->
  <rect y="180" width="400" height="120" fill="#8B7355"/>
  <!-- Dead patches -->
  <ellipse cx="80" cy="220" rx="50" ry="15" fill="#7a6545"/>
  <ellipse cx="250" cy="240" rx="60" ry="12" fill="#6d5a3c"/>
  <ellipse cx="350" cy="210" rx="35" ry="10" fill="#7a6545"/>
  <!-- Weeds -->
  <line x1="60" y1="180" x2="55" y2="155" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="62" y1="180" x2="68" y2="150" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="150" y1="180" x2="145" y2="158" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="300" y1="180" x2="305" y2="155" stroke="#6b7c3f" stroke-width="2"/>
  <line x1="302" y1="180" x2="295" y2="160" stroke="#6b7c3f" stroke-width="2"/>
  <!-- Dead tree -->
  <rect x="195" y="90" width="10" height="90" fill="#6d5a3c"/>
  <line x1="200" y1="120" x2="170" y2="95" stroke="#6d5a3c" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="235" y2="85" stroke="#6d5a3c" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="140" x2="230" y2="120" stroke="#6d5a3c" stroke-width="4" stroke-linecap="round"/>
  <!-- Fence (broken) -->
  <rect x="10" y="140" width="5" height="45" fill="#9e8e78"/>
  <rect x="60" y="145" width="5" height="40" fill="#9e8e78" transform="rotate(8 62 165)"/>
  <rect x="110" y="140" width="5" height="45" fill="#9e8e78"/>
  <rect x="10" y="150" width="105" height="4" fill="#9e8e78"/>
  <rect x="10" y="165" width="105" height="4" fill="#9e8e78"/>
  <!-- Overcast clouds -->
  <ellipse cx="100" cy="50" rx="70" ry="25" fill="#b0b4b8" opacity="0.6"/>
  <ellipse cx="280" cy="40" rx="80" ry="30" fill="#b0b4b8" opacity="0.5"/>
</svg>
