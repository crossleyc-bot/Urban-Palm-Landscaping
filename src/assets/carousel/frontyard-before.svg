<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#c9ccd0"/>
  <!-- Ground - patchy lawn -->
  <rect y="180" width="400" height="120" fill="#a89a6e"/>
  <!-- Bare patches -->
  <ellipse cx="100" cy="220" rx="45" ry="20" fill="#8B7355"/>
  <ellipse cx="280" cy="210" rx="55" ry="15" fill="#8B7355"/>
  <ellipse cx="60" cy="260" rx="40" ry="18" fill="#8B7355"/>
  <ellipse cx="350" cy="250" rx="30" ry="14" fill="#8B7355"/>
  <!-- Sparse grass patches -->
  <ellipse cx="180" cy="230" rx="30" ry="12" fill="#8a9e5e"/>
  <ellipse cx="320" cy="270" rx="25" ry="10" fill="#8a9e5e"/>
  <!-- House -->
  <rect x="120" y="60" width="160" height="120" fill="#B0BEC5"/>
  <rect x="110" y="50" width="180" height="15" fill="#78909C"/>
  <!-- Roof -->
  <polygon points="100,50 200,10 300,50" fill="#607D8B"/>
  <!-- Door -->
  <rect x="180" y="110" width="40" height="70" fill="#5D4037"/>
  <circle cx="212" cy="148" r="3" fill="#FFC107"/>
  <!-- Windows -->
  <rect x="135" y="85" width="30" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="2"/>
  <line x1="150" y1="85" x2="150" y2="115" stroke="#546E7A" stroke-width="1"/>
  <line x1="135" y1="100" x2="165" y2="100" stroke="#546E7A" stroke-width="1"/>
  <rect x="235" y="85" width="30" height="30" fill="#80DEEA" stroke="#546E7A" stroke-width="2"/>
  <line x1="250" y1="85" x2="250" y2="115" stroke="#546E7A" stroke-width="1"/>
  <line x1="235" y1="100" x2="265" y2="100" stroke="#546E7A" stroke-width="1"/>
  <!-- Cracked walkway -->
  <rect x="185" y="180" width="30" height="120" fill="#9E9E9E"/>
  <line x1="185" y1="210" x2="215" y2="215" stroke="#757575" stroke-width="1"/>
  <line x1="195" y1="240" x2="210" y2="235" stroke="#757575" stroke-width="1"/>
  <line x1="190" y1="260" x2="215" y2="270" stroke="#757575" stroke-width="1"/>
</svg>
