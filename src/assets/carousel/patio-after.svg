<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="360" cy="40" r="28" fill="#FFD700"/>
  <!-- Green area -->
  <rect y="160" width="400" height="140" fill="#4CAF50"/>
  <!-- Stone patio -->
  <rect x="30" y="160" width="250" height="130" fill="#D7CCC8" rx="3"/>
  <!-- Stone pattern -->
  <rect x="35" y="165" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="95" y="165" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <rect x="155" y="165" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="215" y="165" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <rect x="35" y="205" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <rect x="95" y="205" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="155" y="205" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <rect x="215" y="205" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="35" y="245" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="95" y="245" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <rect x="155" y="245" width="55" height="35" rx="2" fill="#BCAAA4" stroke="#A1887F" stroke-width="1"/>
  <rect x="215" y="245" width="55" height="35" rx="2" fill="#D7CCC8" stroke="#A1887F" stroke-width="1"/>
  <!-- Outdoor furniture -->
  <circle cx="140" cy="210" r="30" fill="#8D6E63" opacity="0.3"/>
  <circle cx="140" cy="210" r="28" fill="#EFEBE9" stroke="#8D6E63" stroke-width="2"/>
  <circle cx="140" cy="210" r="3" fill="#8D6E63"/>
  <!-- Umbrella pole -->
  <line x1="140" y1="210" x2="140" y2="140" stroke="#5D4037" stroke-width="3"/>
  <!-- Umbrella -->
  <path d="M100 145 Q140 120 180 145" fill="#C62828" stroke="#B71C1C" stroke-width="1"/>
  <!-- Potted plants -->
  <rect x="45" y="175" width="16" height="18" fill="#5D4037" rx="2"/>
  <circle cx="53" cy="170" r="10" fill="#2E7D32"/>
  <circle cx="53" cy="165" r="7" fill="#43A047"/>
  <rect x="240" y="175" width="16" height="18" fill="#5D4037" rx="2"/>
  <circle cx="248" cy="170" r="10" fill="#2E7D32"/>
  <circle cx="248" cy="165" r="7" fill="#43A047"/>
  <!-- Garden border -->
  <circle cx="300" cy="175" r="10" fill="#388E3C"/>
  <circle cx="320" cy="172" r="12" fill="#2E7D32"/>
  <circle cx="340" cy="175" r="10" fill="#388E3C"/>
  <circle cx="360" cy="173" r="11" fill="#2E7D32"/>
  <!-- Flowers in border -->
  <circle cx="310" cy="165" r="4" fill="#E91E63"/>
  <circle cx="340" cy="163" r="4" fill="#FF5722"/>
  <circle cx="355" cy="165" r="4" fill="#9C27B0"/>
  <!-- House wall -->
  <rect x="0" y="40" width="280" height="120" fill="#ECEFF1"/>
  <rect x="0" y="35" width="280" height="10" fill="#B0BEC5"/>
  <!-- Sliding door -->
  <rect x="100" y="55" width="80" height="105" fill="#80DEEA" opacity="0.6" stroke="#78909C" stroke-width="2"/>
  <line x1="140" y1="55" x2="140" y2="160" stroke="#78909C" stroke-width="2"/>
  <!-- String lights -->
  <line x1="30" y1="50" x2="280" y2="50" stroke="#FFF9C4" stroke-width="1" opacity="0.6"/>
  <circle cx="60" cy="52" r="3" fill="#FFF176"/>
  <circle cx="110" cy="52" r="3" fill="#FFF176"/>
  <circle cx="160" cy="52" r="3" fill="#FFF176"/>
  <circle cx="210" cy="52" r="3" fill="#FFF176"/>
  <circle cx="260" cy="52" r="3" fill="#FFF176"/>
  <!-- Clouds -->
  <ellipse cx="120" cy="30" rx="40" ry="12" fill="#fff" opacity="0.7"/>
</svg>
